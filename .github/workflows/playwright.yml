name: Static checks
# CI does not run tests against ParaBank: the public demo site is behind Cloudflare, which blocks
# GitHub's runners and rate-limits bursts of tests. Tests are run locally (see docs/TEST_PLAN.md,
# "Running the suite"). CI checks that the code compiles and that every test can be collected.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npm run typecheck
    - name: Collect all tests
      # Fails on syntax errors, broken imports, duplicate titles or a leftover test.only.
      run: npx playwright test --list --forbid-only
